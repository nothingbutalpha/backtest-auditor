name: secret-scan

# One-time pre-publication scan, removed again before the repository goes public.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (git history)
        run: docker run --rm -v $PWD:/repo zricethezav/gitleaks:v8.24.3 detect --source /repo --redact --no-banner --exit-code 1
      - name: gitleaks (directory)
        run: docker run --rm -v $PWD:/repo zricethezav/gitleaks:v8.24.3 dir /repo --redact --no-banner --exit-code 1
