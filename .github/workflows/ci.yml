name: ci

# Public mirror of the Backtest Auditor CI. Synthetic data only; no secrets, no network beyond installing pinned
# dependencies. The code here is exported from the maintainers' main repository at each release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to full commit SHAs (the tag is in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Published version check (nba_auditor/ must match the PyPI files of the version in pyproject.toml)
        run: python scripts/check_published.py
      - name: Tests (synthetic data only)
        run: python -m pytest -q --ignore=tests/test_docs_snippets.py
      - name: Docs snippets and example walkthrough
        run: python -m pytest -q tests/test_docs_snippets.py
      - name: MCP server starts (stdio)
        run: python -c "import nba_auditor.mcp as m; print(m.server.name)"
      - name: Console scripts installed
        run: |
          nba-auditor explain LA07 > /dev/null
          backtest-auditor explain LA07 > /dev/null
          test -x "$(command -v nba-auditor-mcp)"
      - name: Agent-fix eval (suggested fixes must not change clean lines)
        run: python eval/agent_fix/run_eval.py
